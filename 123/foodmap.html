<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>中央美食地圖</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
    }
    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .card {
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      width: 250px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }
    img {
      width: 100%;
      border-radius: 10px;
    }
    a {
      text-decoration: none;
      color: blue;
    }
  </style>
</head>
<body>
  <h1>中央美食地圖</h1>
  <div class="container">
    <div class="card">
      <img src="1.jpg" alt="牛肉飯">
      <h3>滿食記燒肉丼飯</h3>
      <p>百元燒肉丼飯好去處！</p>
      <a href="https://maps.app.goo.gl/nuEHJy336kJogGXe7">查看地圖</a>
    </div>
    <div class="card">
      <img src="2.jpg" alt="鴨胸義大利麵">
      <h3>No.17 White House</h3>
      <p>犒賞自己的超好吃義式料理！</p>
      <a href="https://maps.app.goo.gl/7X1SDToCXC12kLwK8">查看地圖</a>
    </div>
    <div class="card">
      <img src="3.jpg" alt="甜點咖啡">
      <h3>Backdoor Café</h3>
      <p>平價美味提拉米蘇！</p>
      <a href="https://maps.app.goo.gl/fT3dAe13YFVxUPQH7">查看地圖</a>
    </div>
  </div>
</body>
</html>
